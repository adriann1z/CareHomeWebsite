<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <base href="/CareHomeWebsite/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Meadows Care Home | Residential & Dementia Care in Scartho, Grimsby</title>
    <meta
      name="description"
      content="A warm, CQC-rated care home in Scartho, Grimsby offering residential care, dementia care and respite care for up to 36 residents. Arrange a visit today."
    />
    <!--
      This is a client-rendered SPA — src/components/seo/Seo.tsx swaps the
      title/description/canonical/OG tags per route once React mounts.
      These static tags are the fallback for crawlers/scrapers that don't
      execute JavaScript (they will only ever see the home page's details,
      regardless of the shared URL — see docs/seo-and-search-console.md).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Meadows Care Home" />
    <meta property="og:title" content="The Meadows Care Home | Residential & Dementia Care in Scartho, Grimsby" />
    <meta
      property="og:description"
      content="A warm, CQC-rated care home in Scartho, Grimsby offering residential care, dementia care and respite care for up to 36 residents."
    />
    <meta property="og:image" content="https://adriann1z.github.io/CareHomeWebsite/imagemeadows.png" />
    <script type="module" crossorigin src="./assets/index-gallery.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C59gHeTt.css">
    <style>
      footer a[href$="/privacy-policy"] {
        display: none !important;
      }

      .hero-overlay {
        background: linear-gradient(90deg, rgba(13, 34, 25, .48), rgba(13, 34, 25, .59)),
          linear-gradient(180deg, rgba(9, 28, 20, .15), rgba(9, 28, 20, .26));
      }

      .hero-content {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: inherit;
        padding: 140px 24px 80px;
        text-align: center;
      }

      .hero-content-inner {
        width: 100%;
        max-width: 1080px;
        margin: auto;
      }

      @media (min-width: 1280px) {
        .hero-content-inner {
          transform: translateX(clamp(90px, 7vw, 120px));
        }
      }

      @media (min-width: 1400px) {
        .hero-content-inner {
          transform: translateX(170px);
        }
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
        padding: 9px 19px;
        border: 1px solid rgba(255, 255, 255, .55);
        border-radius: 999px;
        background: rgba(17, 45, 33, .42);
        color: white;
        font: 600 13px/1.2 Arial, sans-serif;
      }

      .hero-badge-dot {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: #c7a663;
      }

      .hero-care-label {
        margin: 25px 0 18px;
        color: #d2b471;
        font: 700 15px/1.4 Arial, sans-serif;
      }

      .hero-heading {
        margin: 0 0 20px;
        color: white !important;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 68px;
        font-weight: 600;
        line-height: .98;
        letter-spacing: 0;
        text-shadow: 0 3px 22px rgba(0, 0, 0, .18);
      }

      .hero-description {
        max-width: 850px;
        margin: 0 auto 28px;
        color: white;
        font: 400 21px/1.45 Arial, sans-serif;
      }

      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 14px;
      }

      .hero-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 170px;
        height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        font: 600 15px/1 Arial, sans-serif;
        transition: background-color .2s, color .2s;
      }

      .hero-button-primary {
        background: #c6a766;
        color: #183c2c;
      }

      .hero-button-primary:hover { background: #dec282; }

      .hero-button-secondary {
        border: 1px solid rgba(255, 255, 255, .8);
        background: rgba(15, 37, 28, .28);
        color: white;
      }

      .hero-button-secondary:hover { background: rgba(15, 37, 28, .6); }

      .hero-scroll-cue {
        position: absolute;
        bottom: 36px;
        left: 50%;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        transform: translateX(-50%);
        border: 1px solid rgba(255, 255, 255, .68);
        border-radius: 50%;
        background: rgba(15, 37, 28, .3);
        color: white;
        cursor: pointer;
      }

      .hero-scroll-cue:hover { background: rgba(15, 37, 28, .65); }

      .hero-scroll-arrow {
        display: block;
        font: 400 25px/1 Arial, sans-serif;
        animation: hero-scroll-bounce 1.8s ease-in-out infinite;
      }

      @keyframes hero-scroll-bounce {
        0%, 100% { transform: translateY(-3px); }
        50% { transform: translateY(3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-scroll-arrow { animation: none; }
      }

      @media (max-width: 1023px) {
        .hero-heading { font-size: 52px; }
      }

      @media (max-width: 639px) {
        .hero-content { min-height: 700px; padding: 100px 20px 40px; }
        .hero-badge { gap: 9px; padding: 9px 13px; font-size: 10px; }
        .hero-care-label { font-size: 12px; }
        .hero-heading { font-size: 38px; }
        .hero-description { font-size: 16px; line-height: 1.5; }
        .hero-actions { flex-direction: column; align-items: center; }
        .hero-button { width: 180px; }
      }

      [aria-label="Cookie consent"] {
        padding: 0 !important;
      }

      [aria-label="Cookie consent"] > div {
        width: 100%;
        max-width: none !important;
        margin: 0 !important;
        padding: 24px clamp(24px, 5vw, 72px) !important;
        border-width: 1px 0 0 !important;
        border-radius: 0 !important;
        box-shadow: 0 -18px 50px rgba(18, 46, 34, 0.18) !important;
      }

      @media (min-width: 768px) {
        [aria-label="Cookie consent"] > div {
          display: grid;
          grid-template-columns: minmax(280px, 0.9fr) minmax(520px, 1.35fr);
          column-gap: clamp(32px, 5vw, 80px);
          align-items: center;
        }

        [aria-label="Cookie consent"] h2,
        [aria-label="Cookie consent"] p {
          grid-column: 1;
        }

        [aria-label="Cookie consent"] h2 {
          margin-bottom: 6px !important;
        }

        [aria-label="Cookie consent"] p {
          margin-bottom: 0 !important;
        }

        [aria-label="Cookie consent"] > div > div {
          grid-column: 2;
          grid-row: 1 / span 2;
        }
      }

      @media (min-width: 1024px) {
        main > div.w-full > section:first-of-type:has(> img) {
          height: calc(100svh - 128px);
          min-height: 690px;
        }

        main > div.w-full > section:first-of-type:has(> img) > img {
          object-position: center 50% !important;
        }

        main > div.w-full > section:first-of-type:not(:has(> img)) {
          height: 360px !important;
          min-height: 360px !important;
          padding-top: 96px !important;
          padding-bottom: 40px !important;
        }

        section[aria-label="Why families trust The Meadows"] {
          height: 128px;
        }

        section[aria-label="Why families trust The Meadows"] > div {
          height: 100%;
          align-items: center;
        }
      }

      @media (max-width: 1023px) {
        main > div.w-full > section:first-of-type:not(:has(> img)) {
          height: auto !important;
          min-height: 300px !important;
          padding-top: 96px !important;
          padding-bottom: 40px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Protective setter to prevent polyfills from crashing when trying to overwrite window.fetch
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => {
              console.warn('Prevented attempting to overwrite window.fetch');
            },
            configurable: true
          });
        }
      } catch(e) {}
    </script>
  </body>
</html>
