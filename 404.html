<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <base href="/CareHomeWebsite/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Meadows Care Home | Residential & Dementia Care in Scartho, Grimsby</title>
    <meta
      name="description"
      content="A warm, CQC-rated care home in Scartho, Grimsby offering residential care, dementia care and respite care for up to 36 residents. Arrange a visit today."
    />
    <!--
      This is a client-rendered SPA — src/components/seo/Seo.tsx swaps the
      title/description/canonical/OG tags per route once React mounts.
      These static tags are the fallback for crawlers/scrapers that don't
      execute JavaScript (they will only ever see the home page's details,
      regardless of the shared URL — see docs/seo-and-search-console.md).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Meadows Care Home" />
    <meta property="og:title" content="The Meadows Care Home | Residential & Dementia Care in Scartho, Grimsby" />
    <meta
      property="og:description"
      content="A warm, CQC-rated care home in Scartho, Grimsby offering residential care, dementia care and respite care for up to 36 residents."
    />
    <meta property="og:image" content="https://adriann1z.github.io/CareHomeWebsite/imagemeadows.png" />
    <script type="module" crossorigin src="./assets/index-3075992.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C59gHeTt.css">
    <style>
      footer a[href$="/privacy-policy"] {
        display: none !important;
      }

      [aria-label="Cookie consent"] {
        padding: 0 !important;
      }

      [aria-label="Cookie consent"] > div {
        width: 100%;
        max-width: none !important;
        margin: 0 !important;
        padding: 24px clamp(24px, 5vw, 72px) !important;
        border-width: 1px 0 0 !important;
        border-radius: 0 !important;
        box-shadow: 0 -18px 50px rgba(18, 46, 34, 0.18) !important;
      }

      @media (min-width: 768px) {
        [aria-label="Cookie consent"] > div {
          display: grid;
          grid-template-columns: minmax(280px, 0.9fr) minmax(520px, 1.35fr);
          column-gap: clamp(32px, 5vw, 80px);
          align-items: center;
        }

        [aria-label="Cookie consent"] h2,
        [aria-label="Cookie consent"] p {
          grid-column: 1;
        }

        [aria-label="Cookie consent"] h2 {
          margin-bottom: 6px !important;
        }

        [aria-label="Cookie consent"] p {
          margin-bottom: 0 !important;
        }

        [aria-label="Cookie consent"] > div > div {
          grid-column: 2;
          grid-row: 1 / span 2;
        }
      }

      @media (min-width: 1024px) {
        main > div.w-full > section:first-of-type:has(> img) {
          height: calc(100svh - 128px);
          min-height: 690px;
        }

        main > div.w-full > section:first-of-type:has(> img) > img {
          object-position: center 50% !important;
        }

        main > div.w-full > section:first-of-type:not(:has(> img)) {
          height: 360px !important;
          min-height: 360px !important;
          padding-top: 96px !important;
          padding-bottom: 40px !important;
        }

        section[aria-label="Why families trust The Meadows"] {
          height: 128px;
        }

        section[aria-label="Why families trust The Meadows"] > div {
          height: 100%;
          align-items: center;
        }
      }

      @media (max-width: 1023px) {
        main > div.w-full > section:first-of-type:not(:has(> img)) {
          height: auto !important;
          min-height: 300px !important;
          padding-top: 96px !important;
          padding-bottom: 40px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Protective setter to prevent polyfills from crashing when trying to overwrite window.fetch
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => {
              console.warn('Prevented attempting to overwrite window.fetch');
            },
            configurable: true
          });
        }
      } catch(e) {}
    </script>
  </body>
</html>
